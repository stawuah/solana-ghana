services:
  - type: web
    name: solana-ghana-community
    runtime: node
    branch: main
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Set these in the Render dashboard, not here.
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: RESEND_VERIFIED
        sync: false
      - key: ORGANISER_EMAIL
        sync: false
      - key: IP_HASH_SALT
        generateValue: true
